version: "3.9"

services:
  postgres-orders:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_pass
    ports:
      - "5432:5432"
    volumes:
      - orders_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_user -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-payments:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: payments_db
      POSTGRES_USER: payments_user
      POSTGRES_PASSWORD: payments_pass
    ports:
      - "5433:5432"
    volumes:
      - payments_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments_user -d payments_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  order-service:
    build:
      context: .
      dockerfile: ./order-service/Dockerfile
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      HTTP_PORT: 8080
      GRPC_PORT: 9090
      DB_DSN: "postgres://orders_user:orders_pass@postgres-orders:5432/orders_db?sslmode=disable"
      PAYMENT_GRPC_ADDR: "payment-service:9091"
      HTTP_TIMEOUT_SEC: 2
    depends_on:
      postgres-orders:
        condition: service_healthy
      payment-service:
        condition: service_started
    restart: on-failure

  payment-service:
    build:
      context: .
      dockerfile: /payment-service/Dockerfile
    ports:
      - "8081:8081"
      - "9091:9091"
    environment:
      HTTP_PORT: 8081
      GRPC_PORT: 9091
      DB_DSN: "postgres://payments_user:payments_pass@postgres-payments:5432/payments_db?sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      postgres-payments:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  notification-service:
    build:
      context: .
      dockerfile: ./notification-service/Dockerfile
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

volumes:
  orders_data:
  payments_data:
  rabbitmq_data:
