name: Generate proto code

on:
  push:
    branches: [main]
    paths:
      - 'proto/**'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Generate pb.go files
        run: |
          mkdir -p assignment1_2/payment/v1 assignment1_2/order/v1
          protoc \
            --go_out=assignment1_2 \
            --go_opt=paths=source_relative \
            --go-grpc_out=assignment1_2 \
            --go-grpc_opt=paths=source_relative \
            proto/payment/v1/payment.proto \
            proto/order/v1/order.proto

      - name: Push to assignment1_2 repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.assignment1_2_REPO_TOKEN }}
        with:
          source-directory: assignment1_2
          destination-github-username: akmazhito
          destination-repository-name: assignment1_2
          target-branch: main
          commit-message: "chore: regenerate from ${{ github.sha }}"
